<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Exercícios em JavaScript</h1>

        <button onclick="verificarIdade()">
            1 - Carteira de Motorista
        </button>

        <button onclick="verificarParImpar()">
            2 - Número Par ou Ímpar
        </button>

        <button onclick="calcularDesconto()">
            3 - Calculadora de Desconto
        </button>

        <button onclick="estadoAgua()">
            4 - Estado da Água
        </button>

    </div>
    <div id="resultado">
            <img id="imgResultado" src="" alt="">
        </div>

    <script src="script2.js"></script>

</body>
</html>
