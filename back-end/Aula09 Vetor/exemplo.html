<script>
  let vaga_a = ["corsa", "gol", "uno"];
  document.write(vaga_a[1]);
  document.write("<br>");
  document.write(vaga_a.length);
  let num  = [5, 8, 4, 6, 7];
  document.write("<br>");
  document.write(num.length);
  //  como imprimir todos os elementos do vetor usando o for
  document.write("<br>");
  for (let i = 0; i < num.length; i++) {
    document.write(`${num[i]} - `);
  }
  document.write("<br>");
  //  como imprimir todos os elementos do vetor usando o forEach
  num.forEach( (vaga) => {
    document.write(`${vaga} - `);
  });
</script>
