<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Matemático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎯 Quiz Matemático</h1>

        <div class="info">
            <p id="numerovidas">❤️ Vidas: <span id="vidas">3</span></p>
            <p>⭐ Pontos: <span id="pontos">0</span></p>
        </div>

        <h2 id="pergunta">0 + 0 = ?</h2>

        <input type="number" id="resposta" placeholder="Digite sua resposta">

        <button onclick="verificarResposta()">Responder</button>

        <p id="mensagem"></p>

        <button id="reiniciar" onclick="reiniciarJogo()">
            Jogar Novamente
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
