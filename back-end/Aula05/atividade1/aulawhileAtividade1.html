<!-- Atividade 1- Tabuada
Crie uma página HTML onde o usuário pode inserir um número, e o JavaScript calculará e exibirá a tabuada desse número, de 1 até 10, utilizando o loop while. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada com While</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Tabuada</h1>

        <input type="number" id="numero" placeholder="Digite um número">

        <button onclick="calcularTabuada()">
            Calcular
        </button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
